<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="TechPro Solutions S.A.C">
  <title>TechPro Solutions S.A.C</title>
  <!-- Outer cyan ring -->
  <circle cx="240" cy="140" r="120" fill="none" stroke="#00A9E0" stroke-width="6"/>
  <!-- Inner cyan ring -->
  <circle cx="240" cy="140" r="105" fill="none" stroke="#00A9E0" stroke-width="2"/>
  <!-- Gray arc top-left -->
  <path d="M 146 110 A 95 95 0 0 1 195 65" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <!-- Central dark circle (laser emitter) -->
  <circle cx="240" cy="135" r="60" fill="#0B1620"/>
  <!-- Inner glow gradient -->
  <defs>
    <radialGradient id="beamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FE3FF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00A9E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B1620" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamLine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7FE3FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7FE3FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7FE3FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="240" cy="135" r="42" fill="url(#beamGlow)"/>
  <!-- Horizontal laser line -->
  <rect x="176" y="133" width="128" height="3" fill="url(#beamLine)"/>
  <!-- Vertical laser line -->
  <rect x="238" y="73" width="3" height="124" fill="url(#beamLine)"/>
  <!-- Diagonal laser lines -->
  <g transform="rotate(45 240 135)">
    <rect x="176" y="133" width="128" height="2" fill="#7FE3FF" opacity="0.85"/>
  </g>
  <g transform="rotate(-45 240 135)">
    <rect x="176" y="134" width="128" height="2" fill="#7FE3FF" opacity="0.85"/>
  </g>
  <!-- Central highlight -->
  <circle cx="240" cy="135" r="6" fill="#FFFFFF"/>
  <!-- Wordmark -->
  <text x="240" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="44" letter-spacing="-0.02em" fill="#0B1620">TECHPRO</text>
  <text x="240" y="306" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" font-size="15" letter-spacing="0.06em" fill="#00A9E0">SOLUTIONS S.A.C</text>
</svg>
